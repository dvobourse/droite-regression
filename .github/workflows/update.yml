name: Mise à jour TTE.PA
on:
  schedule:
    - cron: "30 18 * * 1-5"   # jours ouvrés, après clôture d'Euronext Paris
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas requests
      - run: python scripts/fetch.py
      - name: Commit si changement
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: maj TTE.PA $(date -u +%F)" && git push)
