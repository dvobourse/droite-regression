name: Rapport hebdo screener
on:
  schedule:
    - cron: "0 7 * * 1"   # 9h Paris en heure d'été (UTC+2)
    - cron: "0 8 * * 1"   # 9h Paris en heure d'hiver (UTC+1)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/report.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: dvobourse@gmail.com
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
