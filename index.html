<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBF 120 – Régression & bandes σ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--bd:#e3e6ea;--acc:#2563eb;--s2m:#15803d;--s1m:#65a30d;--s1p:#ea580c;--s2p:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mut:#9aa1ac;--bd:#2a2f37;--acc:#60a5fa;--s2m:#4ade80;--s1m:#a3e635;--s1p:#fb923c;--s2p:#f87171}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mut:#9aa1ac;--bd:#2a2f37;--acc:#60a5fa;--s2m:#4ade80;--s1m:#a3e635;--s1p:#fb923c;--s2p:#f87171}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:1150px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}label{font-size:13px;color:var(--mut)}
select,button,input[type=text]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}button{cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.verdict{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.badge{font-weight:700;font-size:17px;padding:8px 14px;border-radius:10px;color:#fff;display:inline-block;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.k{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px}.k b{display:block;font-size:18px}.k span{font-size:12px;color:var(--mut)}
.kz{cursor:pointer;border-left:5px solid var(--c)}.kz.on{outline:2px solid var(--acc)}
.cv{position:relative;height:420px}
.gauge{position:relative;height:16px;border-radius:8px;margin:26px 6px 22px;background:linear-gradient(90deg,var(--s2m),var(--s1m) 30%,#9ca3af 50%,var(--s1p) 70%,var(--s2p))}
.gauge i{position:absolute;top:-6px;width:4px;height:28px;background:var(--tx);border-radius:2px;transform:translateX(-2px)}
.gauge u{position:absolute;top:20px;font-size:11px;color:var(--mut);text-decoration:none;transform:translateX(-50%)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{cursor:pointer;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}.pill{color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.warn{color:var(--s1p);font-size:13px}.dim{opacity:.5}#msg{color:var(--mut);font-size:13px;margin-top:6px}
</style>
</head>
<body><div class="w">
<h1>SBF 120 – Régression log-linéaire & bandes ±σ</h1>
<div class="sub">Historique max disponible jusqu'à la période choisie : une valeur récente est analysée depuis sa première cotation.</div>
<div class="card"><div class="row">
<button class="tab on" id="t1">Screener</button><button class="tab" id="t2">Analyse détaillée</button>
<label>Période <select id="per"><option value="20" selected>20 ans</option><option value="15">15 ans</option><option value="10">10 ans</option><option value="5">5 ans</option></select></label>
<label>Modèle <select id="mod"><option value="log" selected>Log-linéaire</option><option value="lin">Linéaire</option></select></label>
<label>R² min <select id="r2"><option value="0">aucun</option><option value="0.3">0,3</option><option value="0.5" selected>0,5</option><option value="0.7">0,7</option></select></label>
<button id="th">Thème</button></div><div id="msg">Chargement…</div></div>

<div id="v1"><div class="grid" id="zk"></div>
<div class="card"><div class="row" style="margin-bottom:8px"><input type="text" id="q" placeholder="Rechercher une valeur…"><span class="sub" id="cnt"></span></div>
<div class="wrap" style="max-height:560px;overflow-y:auto"><table><thead><tr id="hd"></tr></thead><tbody id="tb1"></tbody></table></div></div></div>

<div id="v2" style="display:none"><div class="card"><div class="row"><label>Valeur <select id="sel"></select></label></div></div>
<div class="card"><div class="verdict"><span class="badge" id="bd"></span><div id="vt" style="flex:1;min-width:220px"></div></div><div class="gauge" id="g"></div></div>
<div class="card"><div class="cv"><canvas id="c"></canvas></div></div><div class="grid" id="kp"></div>
<div class="card"><b>Niveaux aujourd'hui</b><div class="wrap"><table id="tb"></table></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let D,cur='TTE.PA',chart,rows=[],zf='all',sk='z',sd_=1;
const ZN=[['sm2','Achat fort (≤ −2σ)','--s2m'],['sm1','Zone d\'achat (−2σ à −1σ)','--s1m'],['n','Neutre (±1σ)','--tx'],['sp1','Cher (+1σ à +2σ)','--s1p'],['sp2','Surévalué (≥ +2σ)','--s2p']];
const zi=z=>z<=-2?0:z<=-1?1:z<1?2:z<2?3:4,cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dt=d=>new Date(d*864e5),fmt=d=>dt(d).toLocaleDateString('fr-FR',{month:'short',year:'numeric'});
function fit(st,yrs,log){const d=st.d,L=d.length-1,cut=d[L]-yrs*365.25;let i0=0;while(d[i0]<cut)i0++;const n=L+1-i0;if(n<52)return null;
 const X=[],Y=[];for(let i=i0;i<=L;i++){X.push((d[i]-d[i0])/365.25);Y.push(log?Math.log(st.p[i]):st.p[i])}
 const mx=X.reduce((a,b)=>a+b)/n,my=Y.reduce((a,b)=>a+b)/n;let sxy=0,sxx=0,syy=0;
 for(let i=0;i<n;i++){sxy+=(X[i]-mx)*(Y[i]-my);sxx+=(X[i]-mx)**2;syy+=(Y[i]-my)**2}
 const b=sxy/sxx,a=my-b*mx;let sse=0;for(let i=0;i<n;i++)sse+=(Y[i]-a-b*X[i])**2;const sd=Math.sqrt(sse/(n-2));
 return{i0,n,X,a,b,sd,r2:1-sse/syy,z:(Y[n-1]-a-b*X[n-1])/sd,px:st.p[L],yrs:(d[L]-d[i0])/365.25,short:d[0]>cut+45,log,f:(x,k)=>{const y=a+b*x+k*sd;return log?Math.exp(y):y}}}
const P=()=>[+$('per').value,$('mod').value==='log'];
function build(){const[y,l]=P(),mr=+$('r2').value;rows=[];for(const[t,s]of Object.entries(D.stocks)){const f=fit(s,y,l);if(f)rows.push({t,name:s.n,px:f.px,z:f.z,r2:f.r2,yrs:f.yrs,short:f.short,tr:l?(Math.exp(f.b)-1)*100:f.b/f.px*100})}
 $('zk').innerHTML=ZN.map((z,i)=>`<div class="k kz ${zf==i?'on':''}" style="--c:var(${z[2]})" data-z="${i}"><span>${z[1]}</span><b>${rows.filter(r=>zi(r.z)==i&&r.r2>=mr).length}</b></div>`).join('')+`<div class="k kz ${zf=='all'?'on':''}" style="--c:var(--acc)" data-z="all"><span>Toutes (R² ≥ ${mr})</span><b>${rows.filter(r=>r.r2>=mr).length}</b></div>`;
 document.querySelectorAll('.kz').forEach(e=>e.onclick=()=>{zf=e.dataset.z;build()});list()}
const COLS=[['name','Valeur'],['px','Cours €'],['z','z-score'],['zone','Zone'],['yrs','Historique'],['r2','R²'],['tr','Tendance /an']];
function list(){const mr=+$('r2').value,q=$('q').value.toLowerCase();
 let r=rows.filter(x=>x.r2>=mr&&(zf=='all'||zi(x.z)==zf)&&(x.name+x.t).toLowerCase().includes(q));
 const key=sk=='zone'?'z':sk;r.sort((a,b)=>(typeof a[key]=='string'?a[key].localeCompare(b[key]):a[key]-b[key])*sd_);
 $('hd').innerHTML=COLS.map(c=>`<th data-k="${c[0]}">${c[1]}${sk==c[0]?(sd_>0?' ▲':' ▼'):''}</th>`).join('');
 document.querySelectorAll('#hd th').forEach(h=>h.onclick=()=>{sd_=sk==h.dataset.k?-sd_:1;sk=h.dataset.k;list()});
 $('tb1').innerHTML=r.map(x=>{const z=ZN[zi(x.z)];return`<tr data-t="${x.t}" class="${x.r2<.5?'dim':''}"><td>${x.name} <span class="sub">${x.t.replace('.PA','')}</span></td><td>${x.px.toFixed(2)}</td><td><b>${x.z>=0?'+':''}${x.z.toFixed(2)}</b></td><td><span class="pill" style="background:var(${z[2]==='--tx'?'--mut':z[2]})">${z[1].split(' (')[0]}</span></td><td>${x.yrs.toFixed(1)} ans${x.short?' ⚠':''}</td><td>${x.r2.toFixed(2)}</td><td>${x.tr>=0?'+':''}${x.tr.toFixed(1)} %</td></tr>`}).join('');
 document.querySelectorAll('#tb1 tr').forEach(e=>e.onclick=()=>{cur=e.dataset.t;tab(2)});$('cnt').textContent=r.length+' valeurs · ⚠ = historique < période choisie · lignes grisées = R² < 0,5'}
function detail(){const s=D.stocks[cur],[y,l]=P(),f=fit(s,y,l);if(!f){$('vt').textContent='Historique insuffisant (< 52 semaines).';return}
 $('sel').value=cur;const n=f.n,lab=[],px=[];for(let i=f.i0;i<s.d.length;i++){lab.push(fmt(s.d[i]));px.push(s.p[i])}
 const ds=[{label:'Cours',data:px,borderColor:cv('--acc'),borderWidth:1.6,pointRadius:0}];
 [-2,-1,0,1,2].forEach(k=>ds.push({label:k==0?'Régression':(k>0?'+':'−')+Math.abs(k)+'σ',data:f.X.map(x=>f.f(x,k)),borderColor:cv(ZN[zi(k)][2]),borderWidth:k==0?2:1.4,borderDash:Math.abs(k)==1?[6,4]:[],pointRadius:0}));
 if(chart)chart.destroy();chart=new Chart($('c'),{type:'line',data:{labels:lab,datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
 scales:{x:{ticks:{maxTicksLimit:10,color:cv('--mut')},grid:{display:false}},y:{type:l?'logarithmic':'linear',ticks:{color:cv('--mut'),callback:v=>v+' €'},grid:{color:cv('--bd')}}},
 plugins:{legend:{labels:{color:cv('--tx'),usePointStyle:true}},tooltip:{callbacks:{label:c=>c.dataset.label+' : '+c.parsed.y.toFixed(2)+' €'}}}}});
 const z=ZN[zi(f.z)];$('bd').textContent=z[1].toUpperCase();$('bd').style.background=cv(z[2]);
 $('vt').innerHTML=`<b>${s.n} · z-score ${f.z>=0?'+':''}${f.z.toFixed(2)}σ</b> · cours ${f.px.toFixed(2)} € (${dt(s.d[s.d.length-1]).toLocaleDateString('fr-FR')})<br><span class="${f.r2<.5?'warn':'sub'}">R² = ${f.r2.toFixed(2)}${f.r2<.5?' : tendance peu explicative, signal à prendre avec prudence':''}${f.short?' · historique de '+f.yrs.toFixed(1)+' ans seulement (depuis '+fmt(s.d[0])+')':''}</span>`;
 $('g').innerHTML=`<i style="left:${Math.max(0,Math.min(100,(f.z+3)/6*100))}%"></i>`+[-2,-1,0,1,2].map(k=>`<u style="left:${(k+3)/6*100}%">${k>0?'+':k<0?'−':''}${Math.abs(k)}σ</u>`).join('');
 $('kp').innerHTML=[['Points',n],['Période',fmt(s.d[f.i0])+' → '+fmt(s.d[s.d.length-1])],['Historique',f.yrs.toFixed(1)+' ans'],['R²',f.r2.toFixed(3)],[l?'Croissance/an':'Pente €/an',l?((Math.exp(f.b)-1)*100).toFixed(2)+' %':f.b.toFixed(2)+' €'],['σ',l?(f.sd*100).toFixed(1)+' %':f.sd.toFixed(2)+' €']].map(([k,v])=>`<div class="k"><span>${k}</span><b>${v}</b></div>`).join('');
 const xl=f.X[n-1];$('tb').innerHTML='<tr><th>Niveau</th><th>Prix (€)</th><th>Écart vs cours</th></tr>'+[2,1,0,-1,-2].map(k=>{const p=f.f(xl,k);return`<tr><td style="color:${cv(ZN[zi(k)][2])};font-weight:600">${k==0?'Régression':(k>0?'+':'−')+Math.abs(k)+'σ'}</td><td>${p.toFixed(2)}</td><td>${((p/f.px-1)*100).toFixed(1)} %</td></tr>`}).join('')}
function tab(n){$('v1').style.display=n==1?'':'none';$('v2').style.display=n==2?'':'none';$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)detail()}
const refresh=()=>{if(!D)return;build();if($('v2').style.display!='none')detail()};
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);['per','mod','r2'].forEach(i=>$(i).onchange=refresh);$('q').oninput=list;$('sel').onchange=e=>{cur=e.target.value;detail()};
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';refresh()};
fetch('data/sbf120.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{D=j;if(!D.stocks[cur])cur=Object.keys(D.stocks)[0];
 $('sel').innerHTML=Object.entries(D.stocks).sort((a,b)=>a[1].n.localeCompare(b[1].n)).map(([t,s])=>`<option value="${t}">${s.n} (${t.replace('.PA','')})</option>`).join('');
 $('msg').textContent=`Mise à jour ${D.updated} · ${Object.keys(D.stocks).length} valeurs · ${D.source}`+(D.failed.length?` · sans données : ${D.failed.join(', ')}`:'');build()}).catch(()=>$('msg').textContent='data/sbf120.json introuvable : lance le workflow « Mise à jour » dans l\'onglet Actions.');
</script></body></html>
